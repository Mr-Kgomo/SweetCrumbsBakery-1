    <main>
        <h1>Place an Enquiry </h1>
        <p>Want to order or ask about catering? Fill this out!</p>
 
        <div class="menu-item">
            <form>
                <label>Name:</label><br>
                <input type="text" name="name" required><br><br>

                <label>Email/Cell No:</label><br>
                <input type="email/cell number" name="email/cell number" required><br><br>

                <label>What do you need?</label><br>
                <select name="enquiry_type">
                    <option>Place an Order</option>
                    <option>Catering Quote</option>
                    <option>General Question</option>
                </select><br><br>

                <label>Message:</label><br>
                <textarea name="message" rows="4" cols="30" required></textarea><br><br>

                <button type="submit">Send Enquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 Sweet Crumbs Bakery | Church Street Park, Pretoria</p>
    </footer>
